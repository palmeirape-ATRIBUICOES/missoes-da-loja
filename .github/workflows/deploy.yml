name: 🚀 Deploy para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 🛠️ Install and Build
        run: |
          cd missoes-v2
          npm install
          npm run build

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './missoes-v2/dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Wait for artifact indexing
        run: sleep 5

      - name: 🚀 Deploy to GitHub Pages (Attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: 🚀 Retry Deploy if needed
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: 🚀 Deploy to GitHub Pages (Attempt 2)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
